<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal · Daluminium</title>
<style>
:root{
  --teal:#1FB6CF;--teal-dark:#0E8FA6;--teal-light:#E6F8FB;
  --red:#C0392B;--red-light:#FDF0EE;
  --green:#1A7A45;--green-light:#EDFAF3;
  --amber:#B9770E;--amber-light:#FEF7E6;
  --purple:#7B2D8B;--purple-light:#F3E8FF;
  --gray-1:#F7F8F9;--gray-2:#EEF0F2;--gray-3:#DEE1E5;
  --gray-4:#9AA1AB;--gray-5:#5A6370;--gray-6:#23282F;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-1);color:var(--gray-6);min-height:100vh}

/* LOGIN */
.login-screen{display:none;position:fixed;inset:0;background:linear-gradient(135deg,var(--teal-dark) 0%,#0a6678 100%);z-index:9999;align-items:center;justify-content:center}
.login-screen.active{display:flex}
.login-box{background:white;border-radius:16px;padding:2.5rem;width:min(400px,90vw);box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.login-logo{font-size:32px;font-weight:800;color:var(--teal-dark);letter-spacing:.04em;margin-bottom:4px}
.login-tagline{font-size:13px;color:var(--gray-4);margin-bottom:2rem}
.login-label{font-size:11px;font-weight:700;color:var(--gray-5);text-align:left;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.login-input{width:100%;padding:11px 14px;border-radius:var(--radius);border:1.5px solid var(--gray-3);font-size:14px;font-family:inherit;margin-bottom:12px;transition:border-color .15s}
.login-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,182,207,.12)}
.login-btn{width:100%;padding:12px;border-radius:var(--radius);border:none;background:var(--teal-dark);color:white;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px;transition:background .15s}
.login-btn:hover{background:var(--teal)}
.login-error{font-size:12px;color:var(--red);margin-top:10px;display:none;padding:8px 12px;background:var(--red-light);border-radius:6px}

/* PORTAL */
.portal{display:none;min-height:100vh}
.portal.active{display:block}
.topbar{background:var(--teal-dark);color:white;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.topbar-logo{font-size:16px;font-weight:700;letter-spacing:.04em}
.topbar-logo span{opacity:.7;font-weight:400;font-size:12px;margin-left:8px}
.topbar-user{display:flex;align-items:center;gap:12px;font-size:13px}
.topbar-user strong{opacity:.9}
.btn-sair{background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:background .15s}
.btn-sair:hover{background:rgba(255,255,255,.25)}

.portal-main{max-width:900px;margin:0 auto;padding:3rem 1rem}
.portal-greeting{text-align:center;margin-bottom:3rem}
.portal-greeting h1{font-size:26px;font-weight:700;color:var(--gray-6);margin-bottom:6px}
.portal-greeting p{font-size:14px;color:var(--gray-4)}

.modulos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;justify-content:center}
.modulo-card{background:white;border-radius:14px;padding:2rem;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid transparent;position:relative;overflow:hidden}
.modulo-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.modulo-card.compras{border-top:4px solid var(--teal-dark)}
.modulo-card.compras:hover{border-color:var(--teal-dark)}
.modulo-card.financeiro{border-top:4px solid var(--purple)}
.modulo-card.financeiro:hover{border-color:var(--purple)}
.modulo-icon{font-size:52px;margin-bottom:1rem}
.modulo-title{font-size:18px;font-weight:700;margin-bottom:6px}
.modulo-desc{font-size:13px;color:var(--gray-4);line-height:1.5}
.modulo-badge{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge-compras{background:var(--teal-light);color:var(--teal-dark)}
.badge-financeiro{background:var(--purple-light);color:var(--purple)}
.modulo-arrow{margin-top:1.5rem;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.modulo-card.compras .modulo-arrow{color:var(--teal-dark)}
.modulo-card.financeiro .modulo-arrow{color:var(--purple)}

/* ADMIN */
.admin-section{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--gray-2)}
.admin-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-4);margin-bottom:1rem;text-align:center}
.admin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.admin-card{background:white;border-radius:10px;padding:1rem 1.2rem;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;border:1px solid var(--gray-2);transition:all .15s}
.admin-card:hover{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-light)}
.admin-card svg{flex-shrink:0;opacity:.6}

/* MODAL USUÁRIOS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:12px;width:min(560px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.modal-header{padding:14px 18px 12px;border-bottom:1px solid var(--gray-2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:2}
.modal-title{font-size:14px;font-weight:600}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--gray-2);display:flex;justify-content:flex-end;gap:8px;background:white}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.span2{grid-column:1/-1}
label{font-size:11px;font-weight:700;color:var(--gray-5);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=password],select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--gray-3);font-size:13px;font-family:inherit;color:var(--gray-6);width:100%}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,182,207,.12)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:1px solid transparent;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}
.btn-teal{background:var(--teal-dark);color:white}.btn-teal:hover{background:var(--teal)}
.btn-outline{background:white;color:var(--gray-6);border-color:var(--gray-3)}.btn-outline:hover{background:var(--gray-1)}
.btn-red{background:var(--red);color:white}.btn-red:hover{opacity:.9}
.act{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--gray-3);background:transparent;cursor:pointer;color:var(--gray-4);font-size:13px;margin-left:3px}
.act:hover{border-color:var(--gray-5);color:var(--gray-6);background:var(--gray-1)}
.act-del:hover{border-color:var(--red);color:var(--red);background:var(--red-light)}
.act-edit:hover{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-light)}
svg.icon{width:13px;height:13px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* IFRAME */
.frame-container{display:none;position:fixed;inset:0;z-index:100;flex-direction:column}
.frame-container.active{display:flex}
.frame-topbar{background:var(--teal-dark);color:white;padding:0 1.2rem;display:flex;align-items:center;gap:12px;height:44px;flex-shrink:0}
.frame-back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:white;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;font-weight:500}
.frame-back:hover{background:rgba(255,255,255,.3)}
.frame-title{font-size:13px;font-weight:600;opacity:.9}
.frame-iframe{flex:1;border:none;width:100%;height:100%}

.modulo-check{display:flex;gap:8px;align-items:center;margin-top:4px}
.modulo-check label{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--gray-6);cursor:pointer;display:flex;align-items:center;gap:5px}
.modulo-check input{width:14px;height:14px;cursor:pointer}

@media(max-width:480px){.form-grid{grid-template-columns:1fr}.form-group.span2{grid-column:1}}
